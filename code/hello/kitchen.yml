---
driver:
  name: dokken
  privileged: true
  chef_version: latest

## The forwarded_port port feature lets you connect to ports on the VM guest
## via localhost on the host.
## see also: https://www.vagrantup.com/docs/networking/forwarded_ports

#  network:
#    - ["forwarded_port", {guest: 80, host: 8080}]

transport:
  name: dokken

provisioner:
  name: dokken

  ## product_name and product_version specifies a specific Chef product and version to install.
  ## see the Chef documentation for more details: https://docs.chef.io/workstation/config_yml_kitchen/
  #  product_name: chef
  #  product_version: 18

verifier:
  name: inspec

platforms:
  - name: ubuntu-22.04
    driver:
      image: dokken/ubuntu-22.04
      pid_one_command: /bin/systemd
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/systemd
  - name: ubuntu-26.04
    driver:
      image: dokken/ubuntu-26.04
      pid_one_command: /usr/lib/systemd/systemd
  - name: debian-13
    driver:
      image: dokken/debian-13
      pid_one_command: /usr/lib/systemd/systemd
  - name: rockylinux-10
    driver:
      image: dokken/rockylinux-10
      pid_one_command: /usr/lib/systemd/systemd

suites:
  - name: default
    run_list:
      - recipe[hello::default]
      # NB: autre recette ici ou include dans la recette default
    verifier:
      inspec_tests:
        - test/integration/default
     # NB: peut etre conditionnel en fonction de la plateforme (includes, excludes)
    excludes:
      - ubuntu-24.04
      - ubuntu-26.04

